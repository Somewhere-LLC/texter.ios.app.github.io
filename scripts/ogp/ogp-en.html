<!doctype html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Mono:wght@700&family=Outfit:wght@400;500;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#09090b}
body{position:relative;font-family:'Outfit','Noto Sans JP','Hiragino Sans',sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased}
.glow1{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.28),transparent 62%);right:-320px;top:-420px}
.glow2{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.16),transparent 62%);left:-260px;bottom:-380px}
.wrap{position:absolute;inset:0;padding:60px 72px;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:22px}
.icon{width:92px;height:92px;border-radius:21px;border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 50px rgba(0,0,0,.5);display:block}
.word{font-family:'Space Mono',monospace;font-weight:700;font-size:40px;letter-spacing:-1px}
h1{margin:46px 0 0;font-size:66px;line-height:1.18;font-weight:700;letter-spacing:-1.5px}
h1 .g{background:linear-gradient(135deg,#818cf8 0%,#22d3ee 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:22px 0 0;font-size:25px;line-height:1.55;color:rgba(250,250,250,.72);font-weight:400;max-width:1040px}
.chips{position:absolute;left:72px;bottom:58px;display:flex;align-items:center;gap:12px}
.chip{font-size:21px;font-weight:600;padding:9px 20px;border-radius:999px;background:#18181b;border:1px solid rgba(255,255,255,.1);color:rgba(250,250,250,.72);white-space:nowrap}
.chip.hl{background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.45);color:#22d3ee}
.arrow{color:rgba(250,250,250,.35);font-size:21px}
</style></head><body>
<div class="glow1"></div><div class="glow2"></div>
<div class="wrap">
  <div class="brand"><img class="icon" src="appicon.png" alt=""><span class="word">Texter</span></div>
  <h1>Record the meeting.<br><span class="g">Get notes and to-dos.</span></h1>
  <p class="sub">Texter transcribes, labels speakers, summarizes, and pulls out the tasks.<br>Later, ask questions across your past notes and jump back to the original words.</p>
  <div class="chips"><span class="chip">Record</span><span class="arrow">→</span><span class="chip">Organize</span><span class="arrow">→</span><span class="chip hl">Recall</span><span class="arrow">→</span><span class="chip">Act</span></div>
</div></body></html>
